# Polish technical prose — portable preset, tested with Vale 3.26.0.
StylesPath = .vale/styles
MinAlertLevel = suggestion

# Neutral voice: suitable for reports and instructions.
# No blanket checks for passive voice, negation, foreign-origin terms or decimal precision.
[*.{md,txt}]
BasedOnStyles = PLTechnical

# Keep the preset's installation instructions out of its own prose checks.
[README.md]
BasedOnStyles =
