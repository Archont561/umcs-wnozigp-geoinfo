name: Release format source archives

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged sources
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up locked Pixi tooling
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.84.1
          locked: true
          environments: default

      - name: Run repository checks
        run: pixi run --locked check

      - name: Run package-local smoke tests
        run: pixi run --locked test-smoke

  release:
    name: Publish source archives
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Create separate source archives
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "Refusing unsafe or non-version tag name: $TAG_NAME" >&2
            exit 1
          fi
          mkdir -p dist/release
          tar --exclude='*/__pycache__' --exclude='*.py[co]' --exclude='*/.pytest_cache' \\
            -czf "dist/release/${REPOSITORY_NAME}-latex-${TAG_NAME}.tar.gz" -C packages latex
          tar --exclude='*/__pycache__' --exclude='*.py[co]' --exclude='*/.pytest_cache' \\
            -czf "dist/release/${REPOSITORY_NAME}-typst-${TAG_NAME}.tar.gz" -C packages typst
          (
            cd dist/release
            sha256sum *.tar.gz > SHA256SUMS
          )
          ls -lh dist/release

      - name: Create or update the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=(dist/release/*.tar.gz dist/release/SHA256SUMS)
          if gh release view "$TAG_NAME" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --repo "$REPO" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" \
              --repo "$REPO" \
              --title "Source release $TAG_NAME" \
              --generate-notes \
              --verify-tag
          fi
