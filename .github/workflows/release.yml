name: Release format source archives

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged sources
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up locked Pixi tooling
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.84.1
          locked: true
          environments: default

      - name: Run repository checks
        run: pixi run --locked check

      - name: Run package-local smoke tests
        run: pixi run --locked test-smoke

  release:
    name: Publish source archives
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # The archive and publish steps are Python tools run through Pixi, so
      # this job needs the locked environment it previously did not.
      - name: Set up locked Pixi tooling
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.84.1
          locked: true
          environments: default

      - name: Build and verify the source archives
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        # All archive logic and its assertions live in tools/release/archive.py,
        # with unit tests beside it. Keeping them out of this file means the
        # rules can be exercised without tagging a commit.
        run: pixi run --locked tasknest run release archive

      - name: List the built archives
        run: ls -lh dist/release

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        # The create-versus-upload decision is a tested function in
        # tools/release/publish.py; this step only supplies the environment.
        run: pixi run --locked tasknest run release publish
