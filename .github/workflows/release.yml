name: Release format source archives

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged sources
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up locked Pixi tooling
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.84.1
          locked: true
          environments: default

      - name: Run repository checks
        run: pixi run --locked check

      - name: Run package-local smoke tests
        run: pixi run --locked test-smoke

  release:
    name: Publish source archives
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Create separate source archives
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "Refusing unsafe or non-version tag name: $TAG_NAME" >&2
            exit 1
          fi
          mkdir -p dist/release
          # Fixtures are not part of the deliverable (QA-009, LTX-003, TYP-004):
          # the dummy main, the colocated tests and the caches stay out of the archive.
          tar --exclude='latex/main.*' --exclude='latex/tests' --exclude='latex/tests/*' \
            --exclude='*/__pycache__' --exclude='*.py[co]' --exclude='*/.pytest_cache' \
            -czf "dist/release/${REPOSITORY_NAME}-latex-${TAG_NAME}.tar.gz" -C packages latex
          # Assert the exclusion instead of trusting it.
          if tar -tzf "dist/release/${REPOSITORY_NAME}-latex-${TAG_NAME}.tar.gz" | grep -Eq '^(latex/main\.|latex/tests/)'; then
            echo "::error::the latex archive still contains fixtures" >&2
            exit 1
          fi
          # The archive must carry its own licence, or a consumer of the tarball has no terms.
          if ! tar -tzf "dist/release/${REPOSITORY_NAME}-latex-${TAG_NAME}.tar.gz" | grep -qx 'latex/LICENSE'; then
            echo "::error::the latex archive is missing its LICENSE" >&2
            exit 1
          fi
          # Fixtures are not part of the deliverable (QA-009, LTX-003, TYP-004):
          # the dummy main, the colocated tests and the caches stay out of the archive.
          tar --exclude='typst/main.*' --exclude='typst/tests' --exclude='typst/tests/*' \
            --exclude='*/__pycache__' --exclude='*.py[co]' --exclude='*/.pytest_cache' \
            -czf "dist/release/${REPOSITORY_NAME}-typst-${TAG_NAME}.tar.gz" -C packages typst
          # Assert the exclusion instead of trusting it.
          if tar -tzf "dist/release/${REPOSITORY_NAME}-typst-${TAG_NAME}.tar.gz" | grep -Eq '^(typst/main\.|typst/tests/)'; then
            echo "::error::the typst archive still contains fixtures" >&2
            exit 1
          fi
          # The archive must carry its own licence, or a consumer of the tarball has no terms.
          if ! tar -tzf "dist/release/${REPOSITORY_NAME}-typst-${TAG_NAME}.tar.gz" | grep -qx 'typst/LICENSE'; then
            echo "::error::the typst archive is missing its LICENSE" >&2
            exit 1
          fi
          # The deliverable is lib.typ plus its manifest. Asserting only the
          # absences would let a broken package ship as an archive of READMEs.
          for required in typst/lib.typ typst/typst.toml; do
            if ! tar -tzf "dist/release/${REPOSITORY_NAME}-typst-${TAG_NAME}.tar.gz" | grep -qx "$required"; then
              echo "::error::the typst archive is missing $required" >&2
              exit 1
            fi
          done
          (
            cd dist/release
            sha256sum *.tar.gz > SHA256SUMS
          )
          ls -lh dist/release

      - name: Create or update the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=(dist/release/*.tar.gz dist/release/SHA256SUMS)
          if gh release view "$TAG_NAME" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --repo "$REPO" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" \
              --repo "$REPO" \
              --title "Source release $TAG_NAME" \
              --generate-notes \
              --verify-tag
          fi
