[workspace]
name = "umcs-wnozigp-geoinfo"
version = "0.1.0"
description = "Specification-first scaffold for unofficial UMCS WNoZiGP Geoinformatics thesis-template prototypes"
channels = ["https://prefix.dev/archont561/archont561", "conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]
requires-pixi = ">=0.84.1,<0.85.0"

# One root environment supplies the repository tools and both smoke-build tools.
# Vale is installed from conda-forge; PLTechnical rules remain local in .vale/styles/.
[dependencies]
bun = "==1.4.2"
chktex = ">=1.7.9,<1.8"
python = "==3.12.16"
taplo = "==0.10.0"
tectonic = "==0.17.0"
typst = "==0.15.1"
typstyle = "==0.15.2"
vale = "==3.26.0"
rumdl = ">=0.3.5,<0.4"

[pypi-dependencies]
alint = ">=0.22,<1"
jinja2 = ">=3.1,<4"
pytest = ">=8.3,<9"
pytest-bdd = ">=7.3,<9"
tasknest = ">=0.4.0,<0.5"

[tasks]
check-tool-versions = "python --version && tasknest --version && chktex --version && tectonic --version && typst --version && typstyle --version && vale --version && rumdl --version && taplo --version && bun --version"
lint-alint = "alint check"
lint-toml = "taplo fmt --check pixi.toml pixi-sandbox.toml tasknest.toml .rumdl.toml"
lint-latex = { cmd = "chktex main.tex", cwd = "packages/latex" }
lint-typst = { cmd = "typstyle --check main.typ lib.typ", cwd = "packages/typst" }
lint-vale = "vale --config=.vale.ini --minAlertLevel=warning README.md CONTRIBUTING.md backlog packages/latex packages/typst"
check-pixi-lock = "pixi lock --check --offline"
bun-install = "bun install --frozen-lockfile --ignore-scripts"
lint-markdown = "rumdl check ."
backlog-list = { cmd = "bunx --no-install backlog task list --plain", depends-on = [
  "bun-install",
] }
test-smoke = "pytest -q -m integration packages/latex/tests packages/typst/tests"
vale-demo = "vale --config=.vale.ini --output=JSON --no-exit examples/vale/preset-demo.md"
tools = "tasknest"
build = "tasknest run build"
build-latex = "tasknest run latex build"
build-typst = "tasknest run typst build"
tasknest-check = "tasknest check"
docs-write = "tasknest run docs_write"
docs-check = "tasknest run docs_check"
check = { depends-on = [
  "check-tool-versions",
  "lint-alint",
  "tasknest-check",
  "lint-toml",
  "check-pixi-lock",
  "lint-latex",
  "lint-typst",
  "lint-vale",
  "lint-markdown",
  "backlog-list",
  "docs-check",
] }
